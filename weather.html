<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="container">
        <div class="themetoggle">
            <h1>Weather Dashboard</h1>
            <button id="themeBtn">🌙 Dark</button>
        </div>
        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button id="searchBtn">🔍</button>
        </div>
        <div id="loading" style="display: none;">Loading...</div>
        <div id="weatherCard" class="weather-card" style="display: none;"></div>
        <div id="errorMsg" class="error" style="display: none;"></div>

        <div id="allfav" style="max-width: fit-content">
            <div id="favsec"  >
    
                <button id="show" style="margin: 0px;">Favorites</button><br>
                <div id="favoritesList" style="display: none;" margin="0px"></div>
            </div>
            <div id="favsection" style="display: none;">
                
                <button id="add">Add</button>
                <button id="remove">Remove</button>
            </div>
        </div>


        
    </div>
    <script src="weather.js"></script>
    </body>
    </html>
